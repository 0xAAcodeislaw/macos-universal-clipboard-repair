name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Universal Clipboard Repair
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app bundle
        run: ./build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Universal Clipboard Repair.app" "Universal-Clipboard-Repair-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Clipboard-Repair-macOS
          path: Universal-Clipboard-Repair-macOS.zip
          if-no-files-found: error

name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Clipboard Repair
    runs-on: macos-14
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNING_ENABLED }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$REF_NAME"
          fi
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./build-app.sh

      - name: Sign and notarize app
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-and-notarize.sh "build/Universal Clipboard Repair.app"

      - name: Explain unsigned build
        if: env.SIGNING_ENABLED != 'true'
        run: echo "Signing is not enabled; this artifact is unsigned and may require Gatekeeper approval on first launch."

      - name: Package app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --sequesterRsrc --keepParent "build/Universal Clipboard Repair.app" "Universal-Clipboard-Repair-v${APP_VERSION}-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Clipboard-Repair-v${{ steps.version.outputs.version }}-macOS
          path: Universal-Clipboard-Repair-v${{ steps.version.outputs.version }}-macOS.zip
          if-no-files-found: error

      - name: Package script-only repair
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          script_stage="$RUNNER_TEMP/Universal-Clipboard-Repair-Script"
          mkdir -p "$script_stage"
          cp "Fix-Universal-Clipboard.command" "$script_stage/Fix-Universal-Clipboard.command"
          cp "SCRIPT-README.md" "$script_stage/README.md"
          cp "LICENSE" "$script_stage/LICENSE"
          chmod +x "$script_stage/Fix-Universal-Clipboard.command"
          ditto -c -k --keepParent --norsrc --noextattr --noqtn --noacl "$script_stage" "Universal-Clipboard-Repair-Script-v${APP_VERSION}-macOS.zip"

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Clipboard-Repair-Script-v${{ steps.version.outputs.version }}-macOS
          path: Universal-Clipboard-Repair-Script-v${{ steps.version.outputs.version }}-macOS.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="Universal-Clipboard-Repair-v${APP_VERSION}-macOS.zip"
          script_archive="Universal-Clipboard-Repair-Script-v${APP_VERSION}-macOS.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$script_archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$script_archive" --verify-tag --title "Universal Clipboard Repair $GITHUB_REF_NAME" --generate-notes
          fi

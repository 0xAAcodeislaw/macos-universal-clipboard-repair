name: Build macOS App and DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version; leave blank to use the latest v* tag
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Clipboard Repair
    runs-on: macos-14
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNING_ENABLED }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$INPUT_VERSION"
          if [[ "$REF_NAME" == v* ]]; then
            version="$REF_NAME"
          elif [ -z "$version" ]; then
            version="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi
          if [ -z "$version" ]; then
            version="1.0.3"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./build-app.sh

      - name: Sign and notarize app
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-and-notarize.sh "build/Universal Clipboard Repair.app"

      - name: Explain unsigned build
        if: env.SIGNING_ENABLED != 'true'
        run: echo "Signing is not enabled; this artifact is unsigned and may require Gatekeeper approval on first launch."

      - name: Package app archive
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --sequesterRsrc --keepParent "build/Universal Clipboard Repair.app" "Universal-Clipboard-Repair-v${APP_VERSION}-macOS.zip"

      - name: Package DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/create-dmg.sh "build/Universal Clipboard Repair.app" "Universal-Clipboard-Repair-v${APP_VERSION}-macOS.dmg"

      - name: Package script-only repair
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          script_stage="$RUNNER_TEMP/Universal-Clipboard-Repair-Script"
          mkdir -p "$script_stage"
          cp "Fix-Universal-Clipboard.command" "$script_stage/Fix-Universal-Clipboard.command"
          cp "SCRIPT-README.md" "$script_stage/README.md"
          cp "LICENSE" "$script_stage/LICENSE"
          chmod +x "$script_stage/Fix-Universal-Clipboard.command"
          ditto -c -k --keepParent --norsrc --noextattr --noqtn --noacl "$script_stage" "Universal-Clipboard-Repair-Script-v${APP_VERSION}-macOS.zip"

      - name: Create SHA-256 checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          shasum -a 256 \
            "Universal-Clipboard-Repair-v${APP_VERSION}-macOS.zip" \
            "Universal-Clipboard-Repair-v${APP_VERSION}-macOS.dmg" \
            "Universal-Clipboard-Repair-Script-v${APP_VERSION}-macOS.zip" \
            > "SHA256SUMS-v${APP_VERSION}.txt"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: Universal-Clipboard-Repair-v${{ steps.version.outputs.version }}-macOS-assets
          path: |
            Universal-Clipboard-Repair-v${{ steps.version.outputs.version }}-macOS.zip
            Universal-Clipboard-Repair-v${{ steps.version.outputs.version }}-macOS.dmg
            Universal-Clipboard-Repair-Script-v${{ steps.version.outputs.version }}-macOS.zip
            SHA256SUMS-v${{ steps.version.outputs.version }}.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="Universal-Clipboard-Repair-v${APP_VERSION}-macOS.zip"
          dmg="Universal-Clipboard-Repair-v${APP_VERSION}-macOS.dmg"
          script_archive="Universal-Clipboard-Repair-Script-v${APP_VERSION}-macOS.zip"
          checksums="SHA256SUMS-v${APP_VERSION}.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$dmg" "$script_archive" "$checksums" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$dmg" "$script_archive" "$checksums" --verify-tag --title "Universal Clipboard Repair $GITHUB_REF_NAME" --generate-notes
          fi
